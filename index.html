<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1E1C;
    --bg-2:#0E2621;
    --card:#123330;
    --card-2:#163B37;
    --gold:#C9A227;
    --gold-soft:#E6C866;
    --jade:#4FA88F;
    --cream:#F4ECD8;
    --muted:#9FB8B2;
    --line:rgba(201,162,39,0.18);
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(201,162,39,0.07), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(79,168,143,0.08), transparent 45%),
      var(--bg);
    color:var(--cream);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    direction:rtl;
    -webkit-font-smoothing:antialiased;
  }
  .star-pattern{
    position:fixed; inset:0; pointer-events:none; opacity:0.05; z-index:0;
    background-image:
      radial-gradient(circle, var(--gold) 1px, transparent 1.5px);
    background-size:26px 26px;
  }
  .app{
    position:relative; z-index:1;
    max-width:560px; margin:0 auto;
    min-height:100vh;
    display:flex; flex-direction:column;
    padding-bottom:92px;
  }
  header.top{
    padding:22px 20px 14px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(201,162,39,0.06), transparent);
  }
  header.top .crescent{font-size:26px; display:block; margin-bottom:4px; filter:drop-shadow(0 0 6px rgba(201,162,39,0.4));}
  header.top h1{
    font-family:'Amiri', serif; font-weight:700; font-size:26px; margin:0;
    color:var(--gold-soft); letter-spacing:0.5px;
  }
  header.top p{margin:4px 0 0; font-size:12.5px; color:var(--muted);}

  main{flex:1; padding:16px 16px 8px;}
  section{display:none; animation:fade .25s ease;}
  section.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .list-header{
    display:flex; align-items:center; justify-content:space-between;
    margin:4px 2px 14px;
  }
  .list-header .progress-txt{font-size:13px; color:var(--muted);}
  .list-header .progress-txt b{color:var(--gold-soft);}
  .reset-day{
    background:none; border:1px solid var(--line); color:var(--muted);
    font-family:'Tajawal'; font-size:12px; padding:6px 12px; border-radius:20px;
    cursor:pointer; transition:.2s;
  }
  .reset-day:hover{border-color:var(--gold); color:var(--gold-soft);}

  .card{
    background:linear-gradient(160deg, var(--card), var(--card-2));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 16px 14px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
    transition:.25s;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    position:relative;
    overflow:hidden;
  }
  .card.done{border-color:rgba(201,162,39,0.55); box-shadow:0 0 0 1px rgba(201,162,39,0.25), var(--shadow);}
  .card-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .card-title{font-size:13.5px; color:var(--jade); font-weight:700;}
  .badge{
    font-size:12px; font-weight:700; color:var(--gold-soft);
    background:rgba(201,162,39,0.12); border:1px solid var(--line);
    padding:3px 10px; border-radius:20px; min-width:44px; text-align:center;
  }
  .card.done .badge{background:var(--gold); color:#1a1305; border-color:var(--gold);}
  .card-text{
    font-family:'Amiri', serif; font-size:19px; line-height:2.05;
    color:var(--cream); text-align:right;
  }
  .card-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:12px;}
  .hint{font-size:11.5px; color:var(--muted);}
  .card.done .hint{color:var(--gold-soft);}
  .mini-reset{
    background:none; border:none; color:var(--muted); font-size:11.5px;
    cursor:pointer; text-decoration:underline; padding:2px 4px;
  }
  .progressbar{height:3px; background:rgba(255,255,255,0.06); border-radius:3px; overflow:hidden; margin-top:10px;}
  .progressbar > div{height:100%; background:linear-gradient(90deg, var(--jade), var(--gold)); transition:width .2s;}

  /* Tabs */
  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:5;
    background:rgba(11,30,28,0.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex; max-width:560px; margin:0 auto;
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--muted);
    font-family:'Tajawal'; font-size:10.5px; padding:10px 2px 8px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; transition:.2s;
  }
  nav.tabs button .ic{font-size:17px;}
  nav.tabs button.active{color:var(--gold-soft);}
  nav.tabs button.active .ic{transform:translateY(-1px);}

  /* Tasbih tab */
  .tasbih-wrap{display:flex; flex-direction:column; align-items:center; padding-top:6px;}
  .phrase-chips, .target-chips, .cat-chips{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:16px;
  }
  .chip{
    background:var(--card); border:1px solid var(--line); color:var(--muted);
    font-family:'Tajawal'; font-size:13px; padding:7px 14px; border-radius:20px;
    cursor:pointer; transition:.2s;
  }
  .chip.active{background:var(--gold); border-color:var(--gold); color:#1a1305; font-weight:700;}

  .ring-zone{position:relative; width:230px; height:230px; margin:8px 0 18px; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  .ring-svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:rgba(255,255,255,0.06); stroke-width:10;}
  .ring-fill{fill:none; stroke:url(#ringGrad); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .15s ease;}
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
  }
  .ring-center .count{font-size:52px; font-weight:900; color:var(--gold-soft); line-height:1;}
  .ring-center .of{font-size:13px; color:var(--muted); margin-top:4px;}
  .ring-center .cycles{font-size:11.5px; color:var(--jade); margin-top:6px;}
  .ring-zone.pulse{animation:pulse .4s ease;}
  @keyframes pulse{0%{transform:scale(1);} 40%{transform:scale(1.05);} 100%{transform:scale(1);}}

  .tasbih-actions{display:flex; gap:10px;}
  .btn{
    font-family:'Tajawal'; font-weight:700; font-size:13px; border-radius:24px;
    padding:9px 20px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--cream);
    transition:.2s;
  }
  .btn:hover{border-color:var(--gold);}
  .tasbih-current-text{
    font-family:'Amiri', serif; font-size:22px; color:var(--gold-soft); margin-bottom:6px; text-align:center;
  }

  /* Duas */
  .dua-card{
    background:linear-gradient(160deg, var(--card), var(--card-2));
    border:1px solid var(--line); border-radius:16px; padding:15px 16px;
    margin-bottom:12px; box-shadow:var(--shadow);
  }
  .dua-card .cat-label{font-size:11.5px; color:var(--jade); font-weight:700; margin-bottom:4px;}
  .dua-card h3{font-family:'Amiri', serif; font-size:17px; margin:0 0 8px; color:var(--gold-soft); font-weight:700;}
  .dua-card p{font-family:'Amiri', serif; font-size:18px; line-height:1.95; margin:0; color:var(--cream);}
  .dua-card .copy-btn{
    margin-top:10px; background:none; border:1px solid var(--line); color:var(--muted);
    font-family:'Tajawal'; font-size:11.5px; padding:5px 12px; border-radius:16px; cursor:pointer;
  }
  .dua-card .copy-btn:hover{color:var(--gold-soft); border-color:var(--gold);}

  .empty-note{text-align:center; color:var(--muted); font-size:13px; padding:30px 10px;}

  /* Quran */
  .quran-search-input{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--cream);
    font-family:'Tajawal'; font-size:14px; padding:11px 14px; border-radius:14px;
    margin-bottom:14px; outline:none;
  }
  .quran-search-input::placeholder{color:var(--muted);}
  .surah-grid{display:flex; flex-direction:column; gap:8px;}
  .surah-item{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(160deg, var(--card), var(--card-2));
    border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    cursor:pointer; transition:.2s;
  }
  .surah-item:active{border-color:var(--gold);}
  .surah-item .num{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--gold);
    color:var(--gold-soft); font-size:12px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .surah-item .info{flex:1; margin-right:12px; text-align:right;}
  .surah-item .info .name{font-family:'Amiri', serif; font-size:19px; color:var(--gold-soft); font-weight:700;}
  .surah-item .info .meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .quran-back-btn{margin-bottom:12px;}
  .mushaf-frame{
    position:relative;
    background:linear-gradient(170deg, #16332f, #0e2621);
    border:2px solid var(--gold);
    border-radius:4px;
    padding:22px 16px 18px;
    box-shadow:var(--shadow), inset 0 0 0 5px rgba(11,30,28,0.9), inset 0 0 0 6px rgba(201,162,39,0.35);
  }
  .mushaf-frame::before, .mushaf-frame::after,
  .mushaf-frame .corner-tl, .mushaf-frame .corner-tr, .mushaf-frame .corner-bl, .mushaf-frame .corner-br{
    content:''; position:absolute; width:14px; height:14px;
    border:2px solid var(--gold); transform:rotate(45deg);
  }
  .mushaf-frame .corner-tl{top:-8px; right:-8px;}
  .mushaf-frame .corner-tr{top:-8px; left:-8px;}
  .mushaf-frame .corner-bl{bottom:-8px; right:-8px;}
  .mushaf-frame .corner-br{bottom:-8px; left:-8px;}
  .quran-surah-title{
    font-family:'Amiri', serif; text-align:center; color:var(--gold-soft);
    font-size:24px; margin:0 0 18px; padding:10px 14px;
    border:1px solid var(--gold); border-radius:8px;
    background:linear-gradient(90deg, rgba(201,162,39,0.05), rgba(201,162,39,0.15), rgba(201,162,39,0.05));
  }
  .quran-verses{
    font-family:'Amiri', serif; font-size:21px; line-height:2.4; text-align:justify; text-align-last:right; color:var(--cream);
    touch-action:pan-y;
  }
  .quran-verses .ayah-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; margin:0 3px; vertical-align:middle;
    border:1.5px solid var(--gold); border-radius:50%;
    color:var(--gold-soft); font-size:12px; font-family:'Tajawal'; font-weight:700;
  }
  .page-surah-divider{
    font-family:'Amiri', serif; font-size:19px; color:var(--gold-soft);
    text-align:center; margin:18px 0 10px; padding:8px 14px;
    border:1px solid var(--gold); border-radius:8px;
    background:linear-gradient(90deg, rgba(201,162,39,0.05), rgba(201,162,39,0.15), rgba(201,162,39,0.05));
  }
  .page-surah-divider:first-child{margin-top:0;}
  .swipe-hint{text-align:center; font-size:11px; color:var(--muted); margin-top:10px;}
  .page-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
  }
  .page-indicator{font-size:12.5px; color:var(--muted); font-family:'Tajawal';}
  .continue-card{
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(160deg, var(--card), var(--card-2));
    border:1px solid rgba(201,162,39,0.4); border-radius:14px; padding:13px 16px;
    cursor:pointer;
  }
  .continue-card .txt{font-size:13px; color:var(--muted);}
  .continue-card .txt b{color:var(--gold-soft); font-family:'Amiri', serif; font-size:16px; display:block; margin-top:2px;}
  .spinner{
    width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--gold);
    border-radius:50%; margin:30px auto; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  ::selection{background:rgba(201,162,39,0.35);}
</style>
</head>
<body>
<div class="star-pattern"></div>
<div class="app">

  <header class="top">
    <span class="crescent">☾</span>
    <h1>حصن المسلم</h1>
    <p>أذكار الصباح والمساء · السبحة · الأدعية</p>
  </header>

  <main>
    <!-- MORNING -->
    <section id="tab-morning" class="active">
      <div class="list-header">
        <span class="progress-txt">أنجزت <b id="morning-progress">0</b> من <span id="morning-total">0</span></span>
        <button class="reset-day" onclick="resetList('morning')">إعادة تعيين اليوم</button>
      </div>
      <div id="morning-list"></div>
    </section>

    <!-- EVENING -->
    <section id="tab-evening">
      <div class="list-header">
        <span class="progress-txt">أنجزت <b id="evening-progress">0</b> من <span id="evening-total">0</span></span>
        <button class="reset-day" onclick="resetList('evening')">إعادة تعيين اليوم</button>
      </div>
      <div id="evening-list"></div>
    </section>

    <!-- TASBIH -->
    <section id="tab-tasbih">
      <div class="tasbih-wrap">
        <div class="phrase-chips" id="phrase-chips"></div>
        <div class="tasbih-current-text" id="tasbih-current-text"></div>
        <div class="ring-zone" id="ring-zone">
          <svg class="ring-svg" viewBox="0 0 220 220">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4FA88F"/>
                <stop offset="100%" stop-color="#E6C866"/>
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="110" cy="110" r="98"></circle>
            <circle class="ring-fill" id="ring-fill" cx="110" cy="110" r="98"></circle>
          </svg>

  {id:'d16', cat:'الوالدين', title:'دعاء للوالدين', text:'رَبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا'},
];

/* ---------------- STATE ---------------- */
let morningProgress = {};
let eveningProgress = {};
let tasbihState = { phrase: 't1', counts: {} }; // counts[phraseId] = {count, target, cycles}

async function safeGet(key){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch(e){ return null; }
}
async function safeSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

/* ---------------- RENDER: adhkar lists ---------------- */
function renderList(items, progress, containerId){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  items.forEach(item=>{
    const cur = progress[item.id] || 0;
    const done = cur >= item.count;
    const card = document.createElement('div');
    card.className = 'card' + (done ? ' done' : '');
    card.innerHTML = `
      <div class="card-top">
        <span class="card-title">${item.title}</span>
        <span class="badge">${cur}/${item.count}</span>
      </div>
      <div class="card-text">${item.text}</div>
      <div class="progressbar"><div style="width:${Math.min(100, (cur/item.count)*100)}%"></div></div>
      <div class="card-bottom">
        <span class="hint">${done ? '✓ تم — اضغط لإعادة العد' : 'اضغط للعد'}</span>
        <button class="mini-reset" data-reset="${item.id}">إعادة</button>
      </div>`;
    card.addEventListener('click', (e)=>{
      if(e.target.dataset.reset) return;
      tapItem(item, progress, containerId);
    });
    card.querySelector('[data-reset]').addEventListener('click', (e)=>{
      e.stopPropagation();
      progress[item.id] = 0;
      persistAndRender(containerId);
    });
    container.appendChild(card);
  });
  updateProgressHeader(containerId, items, progress);
}

function tapItem(item, progress, containerId){
  const cur = progress[item.id] || 0;
  progress[item.id] = cur >= item.count ? 0 : cur + 1;
  persistAndRender(containerId);
}

function persistAndRender(containerId){
  if(containerId === 'morning-list'){
    safeSet('adhkar-morning', morningProgress);
    renderList(morningItems, morningProgress, 'morning-list');
  } else {
    safeSet('adhkar-evening', eveningProgress);
    renderList(eveningItems, eveningProgress, 'evening-list');
  }
}

function updateProgressHeader(containerId, items, progress){
  const done = items.filter(i => (progress[i.id]||0) >= i.count).length;
  if(containerId === 'morning-list'){
    document.getElementById('morning-progress').textContent = done;
    document.getElementById('morning-total').textContent = items.length;
  } else {
    document.getElementById('evening-progress').textContent = done;
    document.getElementById('evening-total').textContent = items.length;
  }
}

function resetList(which){
  if(which === 'morning'){
    morningProgress = {};
    persistAndRender('morning-list');
  } else {
    eveningProgress = {};
    persistAndRender('evening-list');
  }
}

/* ---------------- TASBIH ---------------- */
const ringFill = document.getElementById('ring-fill');
const RING_CIRC = 2 * Math.PI * 98;
ringFill.style.strokeDasharray = RING_CIRC;

function renderPhraseChips(){
  const wrap = document.getElementById('phrase-chips');
  wrap.innerHTML = '';
  tasbihPhrases.forEach(p=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (p.id === tasbihState.phrase ? ' active' : '');
    chip.textContent = p.text.length > 14 ? p.text.slice(0,12)+'…' : p.text;
    chip.onclick = ()=>{ tasbihState.phrase = p.id; safeSet('tasbih-state', tasbihState); renderTasbih(); };
    wrap.appendChild(chip);
  });
}
function renderTargetChips(){
  const wrap = document.getElementById('target-chips');
  const cur = getPhraseState();
  wrap.innerHTML = '';
  [33,99,100].forEach(t=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (cur.target === t ? ' active' : '');
    chip.textContent = t;
    chip.onclick = ()=>{ cur.target = t; safeSet('tasbih-state', tasbihState); renderTasbih(); };
    wrap.appendChild(chip);
  });
}
function getPhraseState(){
  if(!tasbihState.counts[tasbihState.phrase]){
    tasbihState.counts[tasbihState.phrase] = {count:0, target:33, cycles:0};
  }
  return tasbihState.counts[tasbihState.phrase];
}
function renderTasbih(){
  renderPhraseChips();
  renderTargetChips();
  const phrase = tasbihPhrases.find(p=>p.id===tasbihState.phrase);
  document.getElementById('tasbih-current-text').textContent = phrase.text;
  const st = getPhraseState();
  document.getElementById('tasbih-count').textContent = st.count;
  document.getElementById('tasbih-of').textContent = 'من ' + st.target;
  document.getElementById('tasbih-cycles').textContent = st.cycles > 0 ? ('عدد الدورات: ' + st.cycles) : '';
  const pct = Math.min(1, st.count / st.target);
  ringFill.style.strokeDashoffset = RING_CIRC * (1 - pct);
}
document.getElementById('ring-zone').addEventListener('click', ()=>{
  const st = getPhraseState();
  st.count++;
  const zone = document.getElementById('ring-zone');
  if(st.count >= st.target){
    st.cycles++;
    st.count = 0;
    zone.classList.add('pulse');
    setTimeout(()=>zone.classList.remove('pulse'), 400);
    if(navigator.vibrate) navigator.vibrate(25);
  }
  safeSet('tasbih-state', tasbihState);
  renderTasbih();
});
function undoTasbih(){
  const st = getPhraseState();
  if(st.count > 0) st.count--;
  safeSet('tasbih-state', tasbihState);
  renderTasbih();
}
function resetTasbih(){
  const st = getPhraseState();
  st.count = 0; st.cycles = 0;
  safeSet('tasbih-state', tasbihState);
  renderTasbih();
}

/* ---------------- DUAS ---------------- */
let activeCat = 'الكل';
function renderCatChips(){
  const cats = ['الكل', ...new Set(duas.map(d=>d.cat))];
  const wrap = document.getElementById('cat-chips');
  wrap.innerHTML = '';
  cats.forEach(c=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (c === activeCat ? ' active' : '');
    chip.textContent = c;
    chip.onclick = ()=>{ activeCat = c; renderCatChips(); renderDuas(); };
    wrap.appendChild(chip);
  });
}
function renderDuas(){
  const list = document.getElementById('duas-list');
  const filtered = activeCat === 'الكل' ? duas : duas.filter(d=>d.cat===activeCat);
  list.innerHTML = '';
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty-note">لا توجد أدعية في هذا القسم</div>';
    return;
  }
  filtered.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'dua-card';
    card.innerHTML = `
      <div class="cat-label">${d.cat}</div>
      <h3>${d.title}</h3>
      <p>${d.text}</p>
      <button class="copy-btn" data-copy="${d.id}">نسخ الدعاء</button>`;
    card.querySelector('.copy-btn').addEventListener('click', ()=>{
      navigator.clipboard?.writeText(d.text).catch(()=>{});
      const btn = card.querySelector('.copy-btn');
      const old = btn.textContent;
      btn.textContent = 'تم النسخ ✓';
      setTimeout(()=>btn.textContent = old, 1400);
    });
    list.appendChild(card);
  });
}

/* ---------------- QURAN (loaded live from a public Quran API, not bundled) ---------------- */
let surahListCache = null;
let currentPage = null;
const TOTAL_PAGES = 604;

async function initQuranTab(){
  showLastReadCard();
  if(surahListCache){ renderSurahList(surahListCache); return; }
  const listEl = document.getElementById('quran-surah-list');
  listEl.innerHTML = '<div class="spinner"></div>';
  const cachedRaw = await safeGet('quran-surah-list-cache');
  if(cachedRaw){ surahListCache = cachedRaw; renderSurahList(cachedRaw); }
  try{
    const res = await fetch('https://api.alquran.cloud/v1/surah');
    const data = await res.json();
    surahListCache = data.data;
    safeSet('quran-surah-list-cache', surahListCache);
    renderSurahList(surahListCache);
  }catch(e){
    if(!cachedRaw){
      listEl.innerHTML = '<div class="empty-note">تعذر تحميل قائمة السور، تحقق من الاتصال بالإنترنت</div>';
    }
  }
}

function renderSurahList(list, filter){
  const listEl = document.getElementById('quran-surah-list');
  const f = (filter||'').trim();
  const items = f ? list.filter(s => s.name.includes(f) || (s.englishName||'').toLowerCase().includes(f.toLowerCase())) : list;
  if(items.length === 0){
    listEl.innerHTML = '<div class="empty-note">لا توجد نتائج</div>';
    return;
  }
  listEl.innerHTML = '';
  items.forEach(s=>{
    const revType = s.revelationType === 'Meccan' ? 'مكية' : 'مدنية';
    const div = document.createElement('div');
    div.className = 'surah-item';
    div.innerHTML = `
      <div class="num">${s.number}</div>
      <div class="info">
        <div class="name">سورة ${s.name.replace('سورة ','')}</div>
        <div class="meta">${revType} · ${s.numberOfAyahs} آية</div>
      </div>`;
    div.addEventListener('click', ()=>openSurah(s.number));
    listEl.appendChild(div);
  });
}

document.getElementById('quran-search').addEventListener('input', (e)=>{
  if(surahListCache) renderSurahList(surahListCache, e.target.value);
});

function switchToReaderView(){
  document.getElementById('quran-list-view').style.display = 'none';
  document.getElementById('quran-reader-view').style.display = 'block';
}

async function openSurah(number){
  switchToReaderView();
  const versesEl = document.getElementById('quran-verses');
  document.getElementById('quran-surah-title').textContent = '';
  document.getElementById('quran-page-indicator').textContent = '';
  versesEl.innerHTML = '<div class="spinner"></div>';
  try{
    const res = await fetch(`https://api.alquran.cloud/v1/ayah/${number}:1/quran-uthmani`);
    const data = await res.json();
    await openPage(data.data.page);
  }catch(e){
    versesEl.innerHTML = '<div class="empty-note">تعذر تحميل السورة، تحقق من الاتصال بالإنترنت</div><button class="btn" onclick="openSurah('+number+')">إعادة المحاولة</button>';
  }
}

async function openPage(pageNum){
  if(pageNum < 1 || pageNum > TOTAL_PAGES) return;
  switchToReaderView();
  currentPage = pageNum;
  const versesEl = document.getElementById('quran-verses');
  versesEl.innerHTML = '<div class="spinner"></div>';
  try{
    const res = await fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-uthmani`);
    const data = await res.json();
    renderPage(data.data);
  }catch(e){
    versesEl.innerHTML = '<div class="empty-note">تعذر تحميل الصفحة، تحقق من الاتصال بالإنترنت</div><button class="btn" onclick="openPage('+pageNum+')">إعادة المحاولة</button>';
  }
}

function renderPage(pageData){
  const versesEl = document.getElementById('quran-verses');
  let html = '';
  let lastSurah = null;
  let firstSurahName = null;
  pageData.ayahs.forEach(a=>{
    if(a.surah.name !== lastSurah){
      html += `<div class="page-surah-divider">سورة ${a.surah.name.replace('سورة ','')}</div>`;
      lastSurah = a.surah.name;
      if(!firstSurahName) firstSurahName = a.surah.name;
    }
    html += `${a.text} <span class="ayah-num">﴿${toArabicDigits(a.numberInSurah)}﴾</span> `;
  });
  versesEl.innerHTML = html;
  document.getElementById('quran-surah-title').textContent = firstSurahName ? ('سورة ' + firstSurahName.replace('سورة ','')) : '';
  document.getElementById('quran-page-indicator').textContent = `الصفحة ${toArabicDigits(currentPage)} من ${toArabicDigits(TOTAL_PAGES)}`;
  safeSet('quran-last-read', {page: currentPage, surahName: firstSurahName});
  window.scrollTo(0,0);
}

function nextPage(){ if(currentPage && currentPage < TOTAL_PAGES) openPage(currentPage + 1); }
function prevPage(){ if(currentPage && currentPage > 1) openPage(currentPage - 1); }

/* Swipe to flip pages (RTL: swipe left = next page, swipe right = previous page) */
(function(){
  const zone = document.getElementById('quran-reader-view');
  let startX = 0, startY = 0, tracking = false;
  zone.addEventListener('touchstart', (e)=>{
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  zone.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if(dx < 0) nextPage(); else prevPage();
  }, {passive:true});
})();

function toArabicDigits(n){
  const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(n).split('').map(d => map[+d] ?? d).join('');
}

function showSurahList(){
  document.getElementById('quran-reader-view').style.display = 'none';
  document.getElementById('quran-list-view').style.display = 'block';
  showLastReadCard();
}

async function showLastReadCard(){
  const last = await safeGet('quran-last-read');
  const el = document.getElementById('quran-continue');
  if(last && last.surahName){
    el.style.display = 'block';
    el.innerHTML = `<div class="continue-card"><div class="txt">متابعة القراءة<b>سورة ${last.surahName.replace('سورة ','')}</b></div><span style="color:var(--gold-soft)">←</span></div>`;
    el.querySelector('.continue-card').onclick = ()=>openPage(last.page);
    return;
  }
  el.style.display = 'none';
}

/* ---------------- TABS ---------------- */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('main section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'quran') initQuranTab();
  });
});

/* ---------------- INIT ---------------- */
async function init(){
  morningProgress = (await safeGet('adhkar-morning')) || {};
  eveningProgress = (await safeGet('adhkar-evening')) || {};
  const savedTasbih = await safeGet('tasbih-state');
  if(savedTasbih) tasbihState = savedTasbih;

  renderList(morningItems, morningProgress, 'morning-list');
  renderList(eveningItems, eveningProgress, 'evening-list');
  renderTasbih();
  renderCatChips();
  renderDuas();
}
init();

/* ---------------- PWA: register service worker ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
